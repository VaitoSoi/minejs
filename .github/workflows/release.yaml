on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v6

      - name: Setup Corepack (for PNPM)
        run: corepack enable

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm eslint .

      - name: Type check
        run: pnpm tsc --noEmit

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint
    
    container:
      image: catthehacker/ubuntu:act-latest
      # options: -v /var/run/docker.sock:/var/run/docker.sock

    strategy:
      fail-fast: false
      matrix:
        mc_version: ["26.2", "26.3"]
    
    services:
      minecraft:
        image: itzg/minecraft-server
        env:
          EULA: "TRUE"
          TYPE: VANILLA
          ONLINE_MODE: "FALSE"
          VERSION: ${{ matrix.mc_version }}
          MODE: survival
          SPAWN_PROTECTION: "0"
          VIEW_DISTANCE: "4"
        options: >-
          --health-cmd "mc-health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v6

      - name: Setup Corepack (for PNPM)
        run: corepack enable

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Run smoke-test for 150s
        run: pnpm tsx test/smoke_test/index.ts
        env:
          VERSION: ${{ matrix.mc_version }}
          NAME: Smoker
          HOST: minecraft
          PORT: 25565
          STAY_SECOND: 150

      - name: Verify if the serevr saw player
        run: |
          CID=$(docker ps -q --filter ancestor=itzg/minecraft-server | head -n1)
          docker logs "$CID" 2>&1 | tee server.log
          grep -q "Smoker joined the game" server.log
          ! grep -qE "disconnected: (Timed out|Internal Exception)" server.log

      - name: Dump logs
        if: failure()
        run: |
          CID=$(docker ps -q --filter ancestor=itzg/minecraft-server | head -n1)
          docker logs "$CID" 2>&1 | tail -n 200
    
  publish:
    runs-on: ubuntu-latest
    needs: ["lint", "smoke-test"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Corepack (for PNPM)
        run: corepack enable

      - name: Setup NPM
        run: npm i -g npm@latest

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tsc

      - name: Publish package
        run: npm publish
  
  gh-page:
    runs-on: ubuntu-latest
    needs: ["lint", "smoke-test"]

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # Setup
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: latest
      
      - name: Setup Corepack (for PNPM)
        run: corepack enable
      
      - name: Install dependency
        run: pnpm install --frozen-lockfile
      
      - name: Build
        # env:
        #   BASE_URL: ${{ github.event.repository.name }}/
        run: pnpm typedoc

      # Pack artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_dist/
      
      # Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4